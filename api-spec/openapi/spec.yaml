openapi: 3.0.3
info:
  title: Book to Course Converter API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/pdf/process:
    post:
      summary: Process uploaded PDF
      operationId: processPdf
      description: Accepts a PDF file and returns structure info with chapters and uploadId.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessPdfResponse'
  /api/v1/course/generate:
    post:
      summary: Generate course module from chapter
      operationId: generateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCourseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCourseResponse'
  /api/v1/books:
    get:
      summary: List books (paginated)
      operationId: getBooksList
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - in: query
          name: search
          schema:
            type: string
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooksResponse'
  /api/v1/books/{uploadId}:
    get:
      summary: Get book by uploadId (with table of contents)
      operationId: getBookById
      parameters:
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
    delete:
      summary: Delete book by uploadId
      operationId: deleteBook
      parameters:
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /api/v1/tasks/{taskId}/submit:
    post:
      summary: Submit a task answer (non-file)
      operationId: submitTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSubmissionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
  /api/v1/tasks/{taskId}/upload:
    post:
      summary: Submit a task file (upload)
      operationId: submitTaskFile
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
  /api/v1/books/{uploadId}/chapters/{chapterId}/notes:
    get:
      summary: Get generated MDX notes bundle for a chapter
      operationId: getChapterNotes
      parameters:
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
        - in: path
          name: chapterId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not Found
components:
  schemas:
    Chapter:
      type: object
      required: [chapterId, title, startPage, endPage, isGenerated]
      properties:
        chapterId:
          type: string
        title:
          type: string
        startPage:
          type: integer
          format: int32
        endPage:
          type: integer
          format: int32
        isGenerated:
          type: boolean
        progressData:
          type: object
          properties:
            tasksCount:
              type: integer
            tasksCompleted:
              type: integer
            tasksFailed:
              type: integer
    ProcessPdfData:
      type: object
      properties:
        uploadId:
          type: string
        pageCount:
          type: integer
        wordCount:
          type: integer
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
      required: [uploadId, pageCount, wordCount, chapters]
    ProcessPdfResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/ProcessPdfData'
      required: [success, data]
    GenerateCourseRequest:
      type: object
      properties:
        uploadId:
          type: string
          nullable: false
        chapterId:
          type: string
          nullable: false
      required: [uploadId, chapterId]
    CourseTask:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        description:
          type: string
        successCriteria:
          type: array
          items:
            type: string
    CourseSection:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        keyConcepts:
          type: array
          items:
            type: string
    GenerateCourseResponse:
      type: object
      properties:
        title:
          type: string
        objectives:
          type: array
          items:
            type: string
        content:
          type: string
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/CourseTask'
      required: [data]
    BookSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        uploadDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        lastUsedAt:
          type: string
          nullable: true
          description: ISO datetime string
    BookDetail:
      type: object
      required: [id, title, uploadDate, chapters]
      properties:
        id:
          type: string
        title:
          type: string
        uploadDate:
          type: string
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, pageSize, total, totalPages]
    PaginatedBooks:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [items, pagination]
    PaginatedBooksResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PaginatedBooks'
      required: [success, data]
    BookDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BookDetail'
      required: [data]
    TaskSubmissionRequest:
      type: object
      properties:
        type:
          type: string
          enum: [multiple-choice, multiple-select, short-answer, code]
        selectedOption:
          type: string
          description: For multiple-choice
        selectedOptions:
          type: array
          items:
            type: string
          description: For multiple-select
        textAnswer:
          type: string
          description: For short-answer/code
      required: [type]
    TaskEvaluation:
      type: object
      properties:
        isCorrect:
          type: boolean
        mistakes:
          type: array
          items:
            type: string
        score:
          type: number
        explanation:
          type: string
    TaskSubmissionResponse:
      type: object
      properties:
        success:
          type: boolean
        evaluation:
          $ref: '#/components/schemas/TaskEvaluation'
        message:
          type: string
      required: [success]
